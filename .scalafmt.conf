version = "3.11.5"
runner.dialect = scala3
maxColumn = 120
align.preset = more
rewrite.trailingCommas.style = multiple
rewrite.scala3.removeOptionalBraces = yes
rewrite.scala3.insertEndMarkerMinLines = 10
rewrite.scala3.removeEndMarkerMaxLines = 5
rewrite.scala3.convertToNewSyntax = yes

# Cross-built and legacy sources. Brace syntax stays, because the Scala 2 compiler is what loads them.
fileOverride {
  "glob:**/scala-switch/legacy/**.scala" {
    runner.dialect = scala213
    rewrite.scala3.convertToNewSyntax = false
  }
  "glob:**/scala-switch/models/**.scala" {
    runner.dialect = scala213
    rewrite.scala3.convertToNewSyntax = false
  }
}
