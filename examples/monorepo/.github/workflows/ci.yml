  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs:
      - zipx-env-image
      - docker
    if: startsWith(github.ref, 'refs/tags/v')
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: prod
            environment: production
            AWS_REGION: us-east-1
            AWS_ROLE_TO_ASSUME: ${{ secrets.PROD_DEPLOY_ROLE }}
            TIER: prod
          - target: staging
            AWS_REGION: us-west-2
            AWS_ROLE_TO_ASSUME: ${{ secrets.STAGING_DEPLOY_ROLE }}
            TIER: staging
    container: ${{ needs.zipx-env-image.outputs.image }}
    env:
      COURSIER_TTL: "0s"
      AWS_REGION: ${{ matrix.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ matrix.AWS_ROLE_TO_ASSUME }}
      TIER: ${{ matrix.TIER }}
      HOME: /home/sbtuser
      JAVA_OPTS: -Duser.home=/home/sbtuser
      SBT_OPTS: -Duser.home=/home/sbtuser
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          fetch-tags: "true"
      - name: zipx sbt setup
        uses: ./.github/actions/zipx-sbt-setup
        with:
          java-version: "21"
          runner-os: ubuntu-latest
          cache-key-suffix: deploy
          cache-mode: restore
          purge: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'purge') }}
          cache-epoch: "8f2e77a00c7c0f58"
          cache-home: /home/sbtuser
      - name: zipx AWS login
        uses: ./.github/actions/zipx-aws-login
        with:
          role-env: AWS_ROLE_TO_ASSUME
          region-env: AWS_REGION
          account-env: AWS_ACCOUNT_ID
          login-ecr: "false"
          name-suffix: ""
      - name: deploy
        run: sbt 'service/promote'
