    outputs:
      image: ${{ steps.zipx-env.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish zipx env image
        id: zipx-env
        run: |
          repo=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${repo}/zipx-env:df-fbf68d13c3e4bb6b3f35c932222c20218e0add947507d74bfe444f761c23ae06"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "zipx-env $image is already published"
            exit 0
          fi
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f .github/zipx-env/Dockerfile -t "$image" .
          docker push "$image"

  verify-gate:
    name: verify-gate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      pull-requests: read
    env:
      COURSIER_TTL: "0s"
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Skip Verify after merged PR push
        id: check
        run: |
          # Commits landed by merging/squashing a PR are associated with that PR via the API.
          # The commit-to-PR index can lag after squash; retry rather than fail-open into a second Verify.
          prs=0
          for attempt in 1 2 3 4 5 6; do
            if [ "$prs" -eq 0 ]; then
              if [ "$attempt" -eq 2 ]; then
                sleep 1
              elif [ "$attempt" -eq 3 ]; then
                sleep 2
              elif [ "$attempt" -eq 4 ]; then
                sleep 4
              elif [ "$attempt" -eq 5 ]; then
                sleep 8
              elif [ "$attempt" -eq 6 ]; then
                sleep 16
              fi
              prs=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                --jq "[.[] | select(.merged_at != null and .base.ref == \"${{ github.ref_name }}\")] | length")
            fi
          done
          if [ "$prs" -gt 0 ]; then
            echo "Merged PR push, skipping redundant Verify (already ran on the PR)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
